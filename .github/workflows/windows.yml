name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build ERate470Lookup.sln -c Release
      - name: Run offline checks
        run: dotnet run --project Checks/Checks.csproj -c Release --no-build
      - name: Publish Windows ${{ matrix.rid }}
        run: dotnet publish Desktop/ERate470Lookup.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}-framework
      - name: Package executable and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item publish/${{ matrix.rid }}-framework/ERate470Lookup.exe package/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md,RELEASE_NOTES.md package/
          if ('${{ matrix.rid }}' -eq 'win-arm64') {
            Copy-Item docs/WINDOWS_ARM64.md package/
            (Get-Content package/README.md -Raw).Replace('docs/WINDOWS_ARM64.md', 'WINDOWS_ARM64.md') | Set-Content package/README.md
          }
          Compress-Archive -Path package/* -DestinationPath ERateLookup-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ERateLookup-${{ matrix.rid }}
          path: ERateLookup-${{ matrix.rid }}.zip
          retention-days: 7
  mac-build:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run shared core checks
        run: dotnet run --project Checks/Checks.csproj -c Release
      - name: Build macOS bundle
        run: |
          bash Publish-Mac.sh ${{ matrix.rid }}
          mkdir -p artifacts
          cp ../ERateLookup-v*-macos-*.zip artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ERateLookup-macOS-${{ matrix.rid }}
          path: artifacts/ERateLookup-v*-macos-*.zip
          retention-days: 7
  android-build:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/android.yml
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, mac-build, android-build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ERateLookup-win-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: ERateLookup-macOS-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: ERateLookup-Android-preview
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Create release with Windows, Mac, and Android downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $windowsAssets = Get-ChildItem "ERateLookup-win-*.zip" | ForEach-Object {
            $architecture = if ($_.Name -match "arm64") { "arm64" } else { "x64" }
            $renamed = "ERateLookup-$env:RELEASE_TAG-win-$architecture.zip"
            Move-Item $_.FullName $renamed
            (Resolve-Path $renamed).Path
          }
          $macAssets = Get-ChildItem "ERateLookup-v*-macos-*.zip" | ForEach-Object {
            $architecture = if ($_.Name -match "arm64") { "arm64" } else { "x64" }
            $renamed = "ERateLookup-$env:RELEASE_TAG-macos-$architecture.zip"
            if ($_.Name -ne $renamed) { Move-Item $_.FullName $renamed }
            (Resolve-Path $renamed).Path
          }
          $androidAssets = Get-ChildItem "ERateLookup-*-android-preview.*" | Where-Object { $_.Extension -in @(".apk", ".zip") } | ForEach-Object { $_.FullName }
          if (@($androidAssets).Count -ne 2) { throw "Expected Android APK and package ZIP" }
          $checksums = Get-ChildItem "ERateLookup-*" | Where-Object { $_.Extension -in @(".apk", ".zip") } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $checksums | Set-Content SHA256SUMS.txt
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @windowsAssets @macAssets @androidAssets "SHA256SUMS.txt" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets" }
            gh release edit "$env:RELEASE_TAG" --title "E-rate Lookup $env:RELEASE_TAG" --notes-file source/RELEASE_NOTES.md
          } else {
            gh release create "$env:RELEASE_TAG" @windowsAssets @macAssets @androidAssets "SHA256SUMS.txt" --verify-tag --title "E-rate Lookup $env:RELEASE_TAG" --notes-file source/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release" }
