name: Android preview APK
on:
  pull_request:
    branches: [main]
    paths: ['Android/**', 'Core/**', 'tests/**', 'Assets/ERateLookup.png', 'docs/ANDROID_INSTALL.md', 'scripts/*android_apk.py', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['Android/**', 'Core/**', 'tests/**', 'Assets/ERateLookup.png', 'docs/ANDROID_INSTALL.md', 'scripts/*android_apk.py', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install android --version 10.0.401
      - name: Install matching Android SDK components
        run: dotnet build Android/ERateLookup.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Shared offline tests
        run: dotnet test tests/ERateLookup.Tests/ERateLookup.Tests.csproj -c Release --filter Category!=Live
      - name: APK verifier security regression checks
        run: python -m unittest discover -s scripts -p 'test_verify_android_apk.py' -v
      - name: Publish standalone preview APK
        run: dotnet publish Android/ERateLookup.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -o publish/android
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(publish/android/*-Signed.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one universal signed APK, found ${#apks[@]}" >&2
            exit 1
          fi
          # Fixed SDK tool names/version; no executable path supplied to Python.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" > publish/android/apk-badging.txt
          python scripts/verify_android_apk.py "${apks[0]}" --badging-file publish/android/apk-badging.txt
          python - <<'PY'
          import hashlib, pathlib, shutil, zipfile, re
          apks = list(pathlib.Path('publish/android').glob('*-Signed.apk'))
          if len(apks) != 1: raise SystemExit(f'Expected one universal signed APK, found {len(apks)}')
          out = pathlib.Path('artifacts'); out.mkdir()
          versions = re.findall(r'<ApplicationDisplayVersion>([0-9]+\.[0-9]+\.[0-9]+)</ApplicationDisplayVersion>', pathlib.Path('Android/ERateLookup.Android.csproj').read_text())
          if len(versions) != 1: raise SystemExit('Expected one Android package version')
          version = versions[0]
          apk = out/f'ERateLookup-v{version}-android-preview.apk'; shutil.copy2(apks[0], apk)
          package = out/f'ERateLookup-v{version}-android-preview.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              for source, target in [('docs/ANDROID_INSTALL.md','ANDROID_INSTALL.md'), ('docs/PORTFOLIO_GUIDE.md','PORTFOLIO_GUIDE.md'), ('LICENSE','LICENSE'), ('CONTRIBUTORS.md','CONTRIBUTORS.md'), ('THIRD_PARTY_NOTICES.md','THIRD_PARTY_NOTICES.md')]: z.write(source, target)
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in [apk, package]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ERateLookup-Android-preview
          path: artifacts/*
          retention-days: 30
