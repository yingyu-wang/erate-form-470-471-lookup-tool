name: Android preview APK
on:
  pull_request:
    branches: [main]
    paths: ['Android/**', 'Core/**', 'Checks/**', 'Assets/ERateLookup.png', 'docs/ANDROID_INSTALL.md', 'scripts/*android_apk.py', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['Android/**', 'Core/**', 'Checks/**', 'Assets/ERateLookup.png', 'docs/ANDROID_INSTALL.md', 'scripts/*android_apk.py', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install android --version 10.0.401
      - name: Install matching Android SDK components
        run: dotnet build Android/ERateLookup.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Shared offline checks
        run: dotnet run --project Checks/Checks.csproj -c Release
      - name: APK verifier security regression checks
        run: python -m unittest discover -s scripts -p 'test_verify_android_apk.py' -v
      - name: Publish standalone preview APK
        run: dotnet publish Android/ERateLookup.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -o publish/android
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(publish/android/*-Signed.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one universal signed APK, found ${#apks[@]}" >&2
            exit 1
          fi
          # Fixed SDK tool names/version; no executable path supplied to Python.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" > publish/android/apk-badging.txt
          python scripts/verify_android_apk.py "${apks[0]}" --badging-file publish/android/apk-badging.txt
          python - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          apks = list(pathlib.Path('publish/android').glob('*-Signed.apk'))
          if len(apks) != 1: raise SystemExit(f'Expected one universal signed APK, found {len(apks)}')
          out = pathlib.Path('artifacts'); out.mkdir()
          apk = out/'ERateLookup-v1.0.1-android-preview.apk'; shutil.copy2(apks[0], apk)
          package = out/'ERateLookup-v1.0.1-android-preview.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              for source, target in [('docs/ANDROID_INSTALL.md','ANDROID_INSTALL.md'), ('LICENSE','LICENSE'), ('THIRD_PARTY_NOTICES.md','THIRD_PARTY_NOTICES.md')]: z.write(source, target)
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in [apk, package]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ERateLookup-Android-preview
          path: artifacts/*
          retention-days: 30
