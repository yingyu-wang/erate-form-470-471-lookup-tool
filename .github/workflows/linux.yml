name: Linux Avalonia packages
on:
  pull_request:
    branches: [main]
    paths: ['LinuxDesktop/**', 'MacDesktop/**', 'Core/**', 'tests/**', 'Assets/**', 'Desktop/Assets/**', 'Publish-Linux.sh', 'scripts/package_linux.py', 'docs/LINUX_INSTALL.md', '.github/workflows/linux.yml']
  push:
    branches: [main]
    paths: ['LinuxDesktop/**', 'MacDesktop/**', 'Core/**', 'tests/**', 'Assets/**', 'Desktop/Assets/**', 'Publish-Linux.sh', 'scripts/package_linux.py', 'docs/LINUX_INSTALL.md', '.github/workflows/linux.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Install GUI launch-check dependencies
        run: |
          set -euo pipefail
          # ubuntu-24.04 lists azure.archive.ubuntu.com first, then
          # archive.ubuntu.com. On 2026-11-11 neither name resolved, apt
          # exited 100 fetching desktop-file-utils, and the job stopped
          # before the tests. The launch libraries are already on the image.
          # Install only what is missing, and do not fail the job when the
          # archive is unreachable but xvfb is already present.
          have_gui() {
            command -v xvfb-run >/dev/null && command -v xauth >/dev/null && command -v xdg-open >/dev/null && ldconfig -p | grep -q 'libfontconfig\.so'
          }
          drop_azure_mirror() {
            mirrors=/etc/apt/apt-mirrors.txt
            if [ -f "$mirrors" ] && grep -q 'azure\.archive\.ubuntu\.com' "$mirrors" && grep -E 'https?://' "$mirrors" | grep -vq 'azure\.archive\.ubuntu\.com'; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
            fi
          }
          if ! have_gui; then
            drop_azure_mirror
            sudo apt-get update
            sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core xdg-utils
          fi
          if ! command -v desktop-file-validate >/dev/null; then
            drop_azure_mirror
            if ! timeout 40 sudo apt-get update || ! timeout 40 sudo apt-get install -y desktop-file-utils; then
              echo "desktop-file-validate was not installed; the launcher check will read the desktop file directly" >&2
            fi
          fi
      - name: Shared offline tests
        run: dotnet test tests/ERateLookup.Tests/ERateLookup.Tests.csproj -c Release --filter Category!=Live
      - name: Build self-contained package
        run: bash Publish-Linux.sh '${{ matrix.rid }}'
      - name: Check extracted package and launch Avalonia window
        env:
          LINUX_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir smoke
          shopt -s nullglob
          archives=(artifacts/ERateLookup-v*-$LINUX_RID.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then echo "Expected one Linux archive" >&2; exit 1; fi
          tar -xzf "${archives[0]}" -C smoke
          app="$PWD/smoke/$(basename "${archives[0]}" .tar.gz)"
          file "$app/ERateLookup"
          mkdir -p "$PWD/smoke-data"
          export XDG_DATA_HOME="$PWD/smoke-data"
          python3 "$app/install-shortcut.py"
          desktop_file="$XDG_DATA_HOME/applications/org.eratelookup.desktop.desktop"
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate "$desktop_file"
          else
            python3 - "$desktop_file" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          if not text.startswith("[Desktop Entry]\n") or "\x00" in text:
              raise SystemExit("desktop file is not a Desktop Entry")
          fields = {}
          for line in text.splitlines():
              if line == "" or line.startswith("#") or line.startswith("["):
                  continue
              if "=" not in line:
                  raise SystemExit("desktop line has no '=': " + line)
              key, value = line.split("=", 1)
              if key in fields:
                  raise SystemExit("duplicate desktop key " + key)
              fields[key] = value
          for key in ("Type", "Name", "Exec", "Icon", "Terminal", "Categories"):
              if not fields.get(key, "").strip():
                  raise SystemExit("desktop file is missing " + key)
          if fields["Type"] != "Application":
              raise SystemExit("desktop Type must be Application")
          if fields["Terminal"] not in ("true", "false"):
              raise SystemExit("desktop Terminal must be true or false")
          if not fields["Exec"].startswith("/usr/bin/env"):
              raise SystemExit("desktop Exec must launch through /usr/bin/env")
          if "ERateLookup" not in fields["Exec"] or "ERateLookup" not in fields["Icon"]:
              raise SystemExit("desktop file does not point at ERateLookup")
          PY
          fi
          timeout 30s xvfb-run -a "$app/ERateLookup" --smoke-test
          timeout 30s xvfb-run -a "$app/ERateLookup" --smoke-portfolio
          # Portfolio data is optional: rejected or unreadable stores must not block lookup startup.
          for problem in future corrupt unopenable; do
            export XDG_DATA_HOME="$PWD/smoke-data-$problem"
            python3 - "$problem" <<'PY'
          import os, pathlib, sqlite3, sys
          folder = pathlib.Path(os.environ['XDG_DATA_HOME']) / 'ERateLookup'
          folder.mkdir(parents=True)
          db = folder / 'portfolio.sqlite3'
          if sys.argv[1] == 'future':
              with sqlite3.connect(db) as conn:
                  conn.execute('PRAGMA user_version=99')
          elif sys.argv[1] == 'corrupt':
              db.write_text('not a database')
          else:
              db.mkdir()
          PY
            timeout 30s xvfb-run -a "$app/ERateLookup" --smoke-test
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ERateLookup-Linux-${{ matrix.rid }}
          path: artifacts/ERateLookup-v*-linux-*.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ERateLookup-Portfolio-screenshot-${{ matrix.rid }}
          path: portfolio-smoke.png
          retention-days: 30
