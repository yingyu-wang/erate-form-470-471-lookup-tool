name: Linux Avalonia packages
on:
  pull_request:
    branches: [main]
    paths: ['LinuxDesktop/**', 'MacDesktop/**', 'Core/**', 'Checks/**', 'Assets/**', 'Desktop/Assets/**', 'Publish-Linux.sh', 'scripts/package_linux.py', 'docs/LINUX_INSTALL.md', '.github/workflows/linux.yml']
  push:
    branches: [main]
    paths: ['LinuxDesktop/**', 'MacDesktop/**', 'Core/**', 'Checks/**', 'Assets/**', 'Desktop/Assets/**', 'Publish-Linux.sh', 'scripts/package_linux.py', 'docs/LINUX_INSTALL.md', '.github/workflows/linux.yml']
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach Linux packages to the existing v1.0.1 release'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install GUI launch-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core xdg-utils desktop-file-utils
      - name: Shared offline checks
        run: dotnet run --project Checks/Checks.csproj -c Release
      - name: Build self-contained package
        run: bash Publish-Linux.sh '${{ matrix.rid }}'
      - name: Check extracted package and launch Avalonia window
        env:
          LINUX_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "artifacts/ERateLookup-v1.0.1-$LINUX_RID.tar.gz" -C smoke
          app="$PWD/smoke/ERateLookup-v1.0.1-$LINUX_RID"
          file "$app/ERateLookup"
          mkdir -p "$PWD/smoke-data"
          export XDG_DATA_HOME="$PWD/smoke-data"
          python3 "$app/install-shortcut.py"
          desktop-file-validate "$XDG_DATA_HOME/applications/org.eratelookup.desktop.desktop"
          timeout 30s xvfb-run -a "$app/ERateLookup" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ERateLookup-Linux-${{ matrix.rid }}
          path: artifacts/ERateLookup-v*-linux-*.tar.gz
          retention-days: 30
  publish-existing-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: eratelookup-release-assets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ERateLookup-Linux-*
          merge-multiple: true
          path: linux-packages
      - name: Attach Linux packages and refresh the aggregate checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.0.1
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName > /dev/null
          mkdir all-packages
          gh release download "$RELEASE_TAG" --pattern 'ERateLookup-*.zip' --pattern 'ERateLookup-*.tar.gz' --dir all-packages
          cp linux-packages/*.tar.gz all-packages/
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          root = Path('all-packages')
          expected = {f'ERateLookup-v1.0.1-{p}' for p in (
              'win-x64.zip', 'win-arm64.zip', 'macos-x64.zip', 'macos-arm64.zip',
              'android-preview.zip', 'linux-x64.tar.gz', 'linux-arm64.tar.gz')}
          actual = {p.name for p in root.iterdir()}
          if actual != expected: raise SystemExit(f'Unexpected release packages: {actual ^ expected}')
          lines = []
          for name in sorted(expected):
              with (root / name).open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {name}\n')
          Path('SHA256SUMS.txt').write_text(''.join(lines), encoding='utf-8')
          PYCODE
          gh release upload "$RELEASE_TAG" linux-packages/*.tar.gz SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json body --jq .body > release-body.md
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p = Path('release-body.md')
          body = p.read_text().split('\n## Linux packages added')[0].rstrip()
          # Correct the historical aggregate-checksum wording without changing other platforms.
          body = body.replace('all five ZIP files', 'all seven package archives')
          sha = os.environ['GITHUB_SHA']
          p.write_text(body + '\n\n## Linux packages added\n\n'
                       'Linux x64 and ARM64 portable Avalonia packages include .NET 10. '
                       'Extract the matching `.tar.gz` and run `ERateLookup`. '
                       'Keep all extracted files together. Ubuntu 24.04 is the native build/launch-check baseline. '
                       'Linux packages were added after the original v1.0.1 tag; '
                       f'[Linux source commit](https://github.com/{os.environ["GH_REPO"]}/commit/{sha}).\n\n'
                       f'[Linux installation/build instructions](https://github.com/{os.environ["GH_REPO"]}/blob/{sha}/docs/LINUX_INSTALL.md). '
                       'SHA256SUMS.txt covers the five existing ZIPs and both Linux archives.\n')
          PYCODE
          gh release edit "$RELEASE_TAG" --notes-file release-body.md
